[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roftegar"
version = "0.1.0"
description = "TUI directory size analyzer"
requires-python = ">=3.10"
dependencies = ["textual>=0.50.0", "psutil>=5.9.0"]

[project.scripts]
roftegar = "roftegar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["roftegar"]
force-include = { "roftegar/roftegar.tcss" = "roftegar/roftegar.tcss" }
