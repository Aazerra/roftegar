name: Build Windows Executable

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build .exe
        run: |
          pyinstaller --clean --onefile --name roftegar roftegar/__main__.py

      - name: Rename output with version
        shell: pwsh
        run: |
          $version = python -c "import tomllib, pathlib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Move-Item -Force dist/roftegar.exe ("dist/roftegar_{0}_windows_amd64.exe" -f $version)

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: roftegar-windows-exe
          path: dist/*_windows_amd64.exe
          if-no-files-found: error
