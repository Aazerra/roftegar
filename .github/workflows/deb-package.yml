name: Build Debian Package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build standalone binary
        run: |
          pyinstaller --clean --onefile --name roftegar roftegar/__main__.py

      - name: Build .deb package
        shell: bash
        run: |
          set -euo pipefail

          VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          print(data['project']['version'])
          PY
          )

          PKG_NAME="roftegar"
          ARCH="amd64"
          PKG_DIR="dist/deb/${PKG_NAME}_${VERSION}_${ARCH}"

          mkdir -p "${PKG_DIR}/DEBIAN"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/usr/share/doc/${PKG_NAME}"

          install -m 755 "dist/roftegar" "${PKG_DIR}/usr/bin/roftegar"
          cp README.md "${PKG_DIR}/usr/share/doc/${PKG_NAME}/README.md"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: ${PKG_NAME}
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: roftegar maintainers
          Depends: libc6
          Description: Terminal UI directory analyzer and system monitor
           roftegar is a Textual-based TUI with disk analysis and system usage plugins.
          EOF

          dpkg-deb --build --root-owner-group "${PKG_DIR}"
          mv "${PKG_DIR}.deb" "dist/${PKG_NAME}_${VERSION}_${ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: roftegar-deb
          path: dist/*.deb
          if-no-files-found: error
